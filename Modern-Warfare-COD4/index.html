<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CoD Research - Modern Warfare</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Call of Duty 4: Modern Warfare Research Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Using docsify-themeable for better customization -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    /* ===== COLOR SCHEME - Change these to customize ===== */
    :root {
      /* Main accent color (links, highlights) */
      --theme-color: #4fc3f7;  /* Light blue - CoD4 theme */

      /* Background colors */
      --base-background-color: #1a1a1a;
      --sidebar-background: #141414;

      /* Text colors */
      --base-color: #e0e0e0;
      --heading-color: #ffffff;

      /* Sidebar */
      --sidebar-nav-link-color: #b0b0b0;
      --sidebar-nav-link-color--active: #4fc3f7;
      --sidebar-nav-link-border-color--active: #4fc3f7;
      --sidebar-name-color: #4fc3f7;
      --sidebar-name-font-size: 1.3rem;

      /* Code blocks */
      --code-inline-background: #2d2d2d;
      --code-block-background: #0d0d0d;
      --code-theme-text: #81d4fa;

      /* Links */
      --link-color: #4fc3f7;
      --link-color--hover: #b3e5fc;

      /* Search */
      --search-background: #2d2d2d;
      --search-result-keyword-background: rgba(79, 195, 247, 0.3);

      /* Misc */
      --blockquote-border-color: #4fc3f7;
      --table-row-even-background: #1f1f1f;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Better heading styles */
    .markdown-section h1 {
      border-bottom: 2px solid var(--theme-color);
      padding-bottom: 10px;
    }

    .markdown-section h2 {
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    /* Sidebar styling */
    .sidebar {
      border-right: 1px solid #2d2d2d;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }

    /* Code block improvements */
    .markdown-section pre {
      border-radius: 6px;
      border: 1px solid #333;
    }

    .markdown-section code {
      border-radius: 3px;
    }

    /* Table styling */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }

    .markdown-section table th {
      background: #252525;
      border: 1px solid #333;
    }

    .markdown-section table td {
      border: 1px solid #333;
    }

    /* Blockquote styling */
    .markdown-section blockquote {
      background: #1f1f1f;
      border-radius: 0 6px 6px 0;
      padding: 15px 20px;
    }

    /* Back link styling */
    .sidebar-nav a[href="../"] {
      color: #888 !important;
      font-size: 0.9em;
    }

    .sidebar-nav a[href="../"]:hover {
      color: var(--theme-color) !important;
    }
    /* ===== Dev-docs readability enhancements ===== */
    /* Cap line length on prose; tables & code stay full-width */
    .markdown-section p,
    .markdown-section li,
    .markdown-section blockquote,
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      max-width: 60rem;
    }
    /* Monospace the first table column (offsets / IDs / code identifiers) */
    .markdown-section table td:first-child,
    .markdown-section table th:first-child {
      font-family: Consolas, "SFMono-Regular", Menlo, monospace;
      white-space: nowrap;
    }
    .markdown-section table { font-variant-numeric: tabular-nums; }
    /* Copy-code button */
    .docsify-copy-code-button {
      font-size: 0.7rem !important;
      background: var(--theme-color) !important;
      color: #0d0d0d !important;
    }
    /* Right-side "On this page" table of contents (wide screens only) */
    .page_toc {
      position: fixed;
      top: 75px;
      right: 20px;
      width: 200px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
      padding: 4px 14px;
      font-size: 0.82rem;
      border-left: 2px solid var(--theme-color);
      z-index: 10;
    }
    .page_toc p.title { font-weight: 600; color: var(--theme-color); margin: 0 0 6px; }
    .page_toc a { display: block; padding: 2px 0; color: #9e9e9e; text-decoration: none; line-height: 1.35; }
    .page_toc a:hover { color: var(--theme-color); }
    .page_toc .lv3 { padding-left: 12px; font-size: 0.95em; }
    @media (min-width: 1301px) { .content { padding-right: 240px; } }
    @media (max-width: 1300px) { .page_toc { display: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'CoD4: Modern Warfare',
      nameLink: '../',
      repo: 'https://github.com/primetime43/CoD-Research/tree/main/Modern-Warfare-COD4',
      loadSidebar: true,
      subMaxLevel: 0,  // left sidebar = page list only; right TOC handles in-page nav
      auto2top: true,
      toc: {
        tocMaxLevel: 3,
        target: 'h2, h3'
      },
      search: {
        placeholder: 'Search...',
        noData: 'No Results',
        depth: 3
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>
</body>
</html>
