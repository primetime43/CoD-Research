name: Deploy Documentation

on:
  push:
    branches:
      - main
      - COD4
      - COD5
      - COD6
      - COD7
      - COD8
      - COD9
      - COD10
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout COD4 branch
        uses: actions/checkout@v4
        with:
          ref: COD4
          path: site/COD4
        continue-on-error: true

      - name: Checkout COD5 branch
        uses: actions/checkout@v4
        with:
          ref: COD5
          path: site/COD5
        continue-on-error: true

      - name: Checkout COD6 branch
        uses: actions/checkout@v4
        with:
          ref: COD6
          path: site/COD6
        continue-on-error: true

      - name: Checkout COD7 branch
        uses: actions/checkout@v4
        with:
          ref: COD7
          path: site/COD7
        continue-on-error: true

      - name: Checkout COD8 branch
        uses: actions/checkout@v4
        with:
          ref: COD8
          path: site/COD8
        continue-on-error: true

      - name: Checkout COD9 branch
        uses: actions/checkout@v4
        with:
          ref: COD9
          path: site/COD9
        continue-on-error: true

      - name: Checkout COD10 branch
        uses: actions/checkout@v4
        with:
          ref: COD10
          path: site/COD10
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
