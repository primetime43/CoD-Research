<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CoD Research - Black Ops</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Call of Duty: Black Ops Research Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Using docsify-themeable for better customization -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    /* ===== COLOR SCHEME - Change these to customize ===== */
    :root {
      /* Main accent color (links, highlights) */
      --theme-color: #ab47bc;  /* Purple - Black Ops theme */

      /* Background colors */
      --base-background-color: #1a1a1a;
      --sidebar-background: #141414;

      /* Text colors */
      --base-color: #e0e0e0;
      --heading-color: #ffffff;

      /* Sidebar */
      --sidebar-nav-link-color: #b0b0b0;
      --sidebar-nav-link-color--active: #ab47bc;
      --sidebar-nav-link-border-color--active: #ab47bc;
      --sidebar-name-color: #ab47bc;
      --sidebar-name-font-size: 1.3rem;

      /* Code blocks */
      --code-inline-background: #2d2d2d;
      --code-block-background: #0d0d0d;
      --code-theme-text: #ce93d8;

      /* Links */
      --link-color: #ab47bc;
      --link-color--hover: #e1bee7;

      /* Search */
      --search-background: #2d2d2d;
      --search-result-keyword-background: rgba(171, 71, 188, 0.3);

      /* Misc */
      --blockquote-border-color: #ab47bc;
      --table-row-even-background: #1f1f1f;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Better heading styles */
    .markdown-section h1 {
      border-bottom: 2px solid var(--theme-color);
      padding-bottom: 10px;
    }

    .markdown-section h2 {
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    /* Sidebar styling */
    .sidebar {
      border-right: 1px solid #2d2d2d;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }

    /* Code block improvements */
    .markdown-section pre {
      border-radius: 6px;
      border: 1px solid #333;
    }

    .markdown-section code {
      border-radius: 3px;
    }

    /* Table styling */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }

    .markdown-section table th {
      background: #252525;
      border: 1px solid #333;
    }

    .markdown-section table td {
      border: 1px solid #333;
    }

    /* Blockquote styling */
    .markdown-section blockquote {
      background: #1f1f1f;
      border-radius: 0 6px 6px 0;
      padding: 15px 20px;
    }

    /* Back link styling */
    .sidebar-nav a[href="../"] {
      color: #888 !important;
      font-size: 0.9em;
    }

    .sidebar-nav a[href="../"]:hover {
      color: var(--theme-color) !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'CoD7: Black Ops',
      nameLink: '../',
      repo: 'https://github.com/primetime43/CoD-Research/tree/main/Black-Ops-COD7',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search...',
        noData: 'No Results',
        depth: 3
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
